<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GK Heavy Ltd</title>
  <meta name="description" content="GK Heavy Ltd — Good furnaces come to those who work.">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      min-height: 100vh;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .logo {
      display: block;
      width: min(92vw, 1069px);
      height: auto;
    }

    .email-link {
      display: block;
      width: min(72vw, 720px);
      line-height: 0;
    }

    .email-image {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      main {
        padding: 24px 16px;
        gap: 24px;
      }

      .logo {
        width: 96vw;
      }

      .email-link {
        width: 88vw;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="logo.png"
      alt="GK Heavy Ltd — Good furnaces come to those who work."
    >

    <a class="email-link" href="mailto:info@gkheavy.com" aria-label="Email info@gkheavy.com">
      <img
        class="email-image"
        src="info.png"
        alt="info@gkheavy.com"
      >
    </a>
  </main>
</body>
</html>
